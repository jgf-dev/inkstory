name: SonarQube analysis

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Shared CI DATABASE_URL + SonarCloud project metadata: overlapping Analysis
# jobs race on fixtures and scanner project.protobuf. Keep one at a time.
concurrency:
  group: sonar-analysis-${{ github.repository }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  Analysis:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      # SonarCloud project.protobuf can 500 after branch renames / empty recreate.
      # Only the Sonar isMain branch index must be healthy for PR scans. Do not
      # treat unscoped 500 alone as fatal (that previously wiped a healthy main).
      # Fresh projects default to master — leave that name until a successful
      # analysis lands; renaming an empty project to main reintroduces the 500.
      - name: Ensure SonarCloud main branch is healthy
        id: sonar_health
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        run: |
          set -euo pipefail
          host="${SONAR_HOST_URL:-https://sonarcloud.io}"
          host="${host%/}"
          echo "soft_fail=false" >> "$GITHUB_OUTPUT"

          main_branch_name() {
            python3 -c 'import json,sys; bs=json.load(open("/tmp/sonar-branches.json")).get("branches") or []; m=[b for b in bs if b.get("isMain")]; print(m[0]["name"] if m else "")' 2>/dev/null || true
          }

          refresh_branches() {
            curl -sfS -u "${SONAR_TOKEN}:" \
              "${host}/api/project_branches/list?project=jgf-dev_inkstory" \
              | tee /tmp/sonar-branches.json
          }

          protobuf_code() {
            local path="$1"
            curl -sS -o /tmp/sonar-protobuf.out -w '%{http_code}' -u "${SONAR_TOKEN}:" \
              "${host}${path}" || true
          }

          # Scanner loads project.protobuf?branch=<Sonar isMain name>.
          main_index_ok() {
            local name="$1"
            if [ -z "$name" ]; then
              return 1
            fi
            local code
            code=$(protobuf_code "/batch/project.protobuf?key=jgf-dev_inkstory&branch=${name}")
            echo "project.protobuf?branch=${name} HTTP ${code}"
            [ "$code" = "200" ] || [ "$code" = "404" ]
          }

          wait_for_main_index() {
            local name="$1"
            local i
            for i in 1 2 3 4 5 6; do
              if main_index_ok "$name"; then
                return 0
              fi
              echo "Waiting for Sonar index (${i}/6)..."
              sleep 15
            done
            return 1
          }

          recreate_project() {
            echo "Recreating SonarCloud project jgf-dev_inkstory"
            curl -sfS -u "${SONAR_TOKEN}:" -X POST \
              "${host}/api/projects/delete?project=jgf-dev_inkstory" || true
            echo
            curl -sfS -u "${SONAR_TOKEN}:" -X POST \
              "${host}/api/projects/create?organization=jgf-dev&project=jgf-dev_inkstory&name=inkstory"
            echo
            # Intentionally keep default master until first successful analysis.
          }

          if ! refresh_branches; then
            echo
            echo "Project missing; recreating"
            recreate_project
            refresh_branches || true
          fi
          echo
          name=$(main_branch_name)
          echo "Sonar main branch: ${name:-<none>}"

          if wait_for_main_index "$name"; then
            echo "Sonar isMain index healthy"
            exit 0
          fi

          echo "Corrupt isMain project.protobuf — deleting analyses on ${name}"
          curl -sfS -u "${SONAR_TOKEN}:" \
            "${host}/api/project_analyses/search?project=jgf-dev_inkstory&branch=${name}&ps=100" \
            | tee /tmp/sonar-analyses.json || true
          echo
          python3 -c '
          import json, subprocess, os
          host = (os.environ.get("SONAR_HOST_URL") or "https://sonarcloud.io").rstrip("/")
          token = os.environ["SONAR_TOKEN"]
          try:
              data = json.load(open("/tmp/sonar-analyses.json"))
          except Exception:
              raise SystemExit(0)
          for a in data.get("analyses") or []:
              key = a.get("key")
              if not key:
                  continue
              print(f"Deleting analysis {key}")
              subprocess.run(
                  ["curl", "-sfS", "-u", f"{token}:", "-X", "POST",
                   f"{host}/api/project_analyses/delete?analysis={key}"],
                  check=False,
              )
          '

          if wait_for_main_index "$name"; then
            echo "Sonar isMain index healthy after analysis delete"
            exit 0
          fi

          recreate_project
          refresh_branches || true
          echo
          name=$(main_branch_name)
          echo "Sonar main branch after recreate: ${name:-<none>}"
          if wait_for_main_index "$name"; then
            echo "Sonar isMain index healthy after recreate"
            exit 0
          fi

          echo "SonarCloud index still 500 after recreate — soft-failing Analysis"
          echo "soft_fail=true" >> "$GITHUB_OUTPUT"

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.2"

      # Skip lifecycle scripts during install; emit Prisma contract explicitly below.
      - run: bun install --ignore-scripts --frozen-lockfile

      - name: Emit Prisma contract
        run: ./node_modules/.bin/prisma contract emit
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      # CI DATABASE_URL is a shared test DB; apply the current contract so Codex
      # tables exist before integration coverage runs.
      - name: Apply Prisma schema to CI database
        run: ./node_modules/.bin/prisma db update -y --db "$DATABASE_URL"
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DIRECT_URL: ${{ secrets.DATABASE_URL }}

      - name: Run tests with coverage
        run: bun run test:cov
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DIRECT_URL: ${{ secrets.DATABASE_URL }}

      # Automatic Analysis conflicts with CI scanner uploads.
      - name: Disable SonarCloud Automatic Analysis
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        run: |
          host="${SONAR_HOST_URL:-https://sonarcloud.io}"
          host="${host%/}"
          curl -sfS -u "${SONAR_TOKEN}:" \
            -X POST "${host}/api/autoscan/activation?projectKey=jgf-dev_inkstory&enable=false" || true

      - name: Analyze with SonarQube
        id: sonar_scan
        continue-on-error: true
        uses: SonarSource/sonarqube-scan-action@22918119ff8e1ca75a623e15c8296b6ea4fbe28f # v8.2.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        with:
          args: >-
            -Dsonar.projectKey=jgf-dev_inkstory
            -Dsonar.organization=jgf-dev
            -Dsonar.sources=src
            -Dsonar.tests=tests
            -Dsonar.javascript.lcov.reportPaths=coverage/lcov.info
            -Dsonar.coverage.exclusions=**/*.d.ts,**/supabase/types.ts
            -Dsonar.cpd.exclusions=**/tests/**,**/*.test.ts,**/*.test.tsx

      # Fail the job on real scanner errors. Soft-pass only when SonarCloud's
      # project.protobuf index is known-broken (platform 500 after recreate).
      - name: Enforce Sonar result
        if: always() && steps.sonar_scan.outcome != 'skipped'
        run: |
          if [ "${{ steps.sonar_scan.outcome }}" = "success" ]; then
            echo "Sonar scanner succeeded"
            exit 0
          fi
          if [ "${{ steps.sonar_health.outputs.soft_fail }}" = "true" ]; then
            echo "::warning::SonarCloud project.protobuf still HTTP 500 after recreate; treating Analysis as soft-pass so PR merge is not blocked on SonarCloud platform corruption. Re-check SonarCloud / support."
            exit 0
          fi
          echo "Sonar scanner failed without soft-fail allowance"
          exit 1
