name: opencode

on:
  issue_comment:
    types: 
     - created
     - edited
  pull_request_review_comment:
    types: 
     - created
     - edited
  pull_request_review: 
    types:
      - submitted
      - edited

  pull_request:
    types: 
      - edited
      - opened
      - ready_for_review
      - synchronize
      - reopened
      - review_requested
jobs:
  opencode:
    if: |
      contains(github.event.comment.body, ' /oc') ||
      startsWith(github.event.comment.body, '/oc') ||
      contains(github.event.comment.body, ' /opencode') ||
      startsWith(github.event.comment.body, '/opencode')
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
      pull-requests: write
      issues: write
      checks: read
      actions: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Run opencode
        uses: anomalyco/opencode/github@803d9eb7ad5f4dfd832d7506a7cad83ded52253e # v1.4.9
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        with:
          model: openrouter/qwen/qwen3.8-flash
