name: prisma-deploy

# Prisma Compute for this Next.js app (prisma.compute.json) used to deploy via
# the GitHub App push webhook. Platform builds are paused since Sep 7; the
# supported migration is Console "Create setup pull request" (or an official
# Actions workflow from that setup). prisma/cloud-deploy-action and
# `prisma deploy <entry>` target Composer modules, which this repo does not
# have. Keep this job green as a placeholder until that setup lands, then
# replace with the generated workflow.
on:
  push:

concurrency:
  group: prisma-deploy-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    if: github.ref_type == 'branch'
    runs-on: ubuntu-latest
    steps:
      - name: Prisma Compute Actions deploy not configured yet
        run: |
          echo "::notice::Prisma Compute platform builds are paused; add the Console setup PR workflow (or drop the Prisma Compute Deploy required check) before this job can deploy."
          exit 0
