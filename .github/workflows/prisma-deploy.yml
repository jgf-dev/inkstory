name: prisma-deploy

on:
  push:

concurrency:
  group: prisma-deploy-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    if: github.ref_type == 'branch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - name: Use npm 12 (matches package.json devEngines)
        run: npm install -g npm@12.0.2 --ignore-scripts
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      # Repo is npm-based but also has a stale bun.lock; force npm ci.
      # Skip lifecycle scripts and emit the Prisma contract explicitly (matches CI).
      - uses: prisma/cloud-deploy-action@cd0add6285e54968ae412e21c4b9ae2cb129497c # v1
        with:
          install-command: npm ci --ignore-scripts && ./node_modules/.bin/prisma contract emit
          build-command: npm run build
        env:
          DATABASE_URL: postgresql://placeholder@localhost:5432/placeholder