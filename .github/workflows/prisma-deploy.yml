name: prisma-deploy

# Next.js Compute apps deploy with `prisma app deploy` (prisma.compute.json),
# not prisma/cloud-deploy-action (Composer `deploy module.ts`).
on:
  push:

concurrency:
  group: prisma-deploy-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write
  statuses: write

jobs:
  deploy:
    if: github.ref_type == 'branch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"

      - name: Use npm 12 (matches package.json devEngines)
        run: npm install -g npm@12.0.2 --ignore-scripts

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Emit Prisma contract
        run: ./node_modules/.bin/prisma contract emit
        env:
          DATABASE_URL: postgresql://placeholder@localhost:5432/placeholder
