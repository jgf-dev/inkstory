name: prisma-deploy

# Next.js Compute apps deploy with `@prisma/cli app deploy` (prisma.compute.json), (re-enabled)
# not prisma/cloud-deploy-action (Composer `deploy module.ts`).
on:
  push:

concurrency:
  group: prisma-deploy-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write
  statuses: write

jobs:
  deploy:
    if: github.ref_type == 'branch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --ignore-scripts

      - name: Emit Prisma contract
        run: bunx prisma contract emit
        env:
          DATABASE_URL: postgresql://placeholder@localhost:5432/placeholder

      - name: Exchange GitHub OIDC for Prisma workspace token
        id: prisma_auth
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7
        with:
          script: |
            const apiUrl = 'https://api.prisma.io'
            const requestUrl = process.env.ACTIONS_ID_TOKEN_REQUEST_URL
            const requestToken = process.env.ACTIONS_ID_TOKEN_REQUEST_TOKEN
            if (!requestUrl || !requestToken) {
              core.setFailed('GitHub OIDC request URL/token missing; need id-token: write')
              return
            }
            const oidcRes = await fetch(`${requestUrl}&audience=prisma-cloud`, {
              headers: { authorization: `Bearer ${requestToken}` },
            })
            if (!oidcRes.ok) {
              core.setFailed(`GitHub OIDC token request responded ${oidcRes.status}`)
              return
            }
            const oidcToken = (await oidcRes.json()).value
            const exchangeRes = await fetch(`${apiUrl}/v1/auth/github-actions/token`, {
              method: 'POST',
              headers: { 'content-type': 'application/json' },
              body: JSON.stringify({ token: oidcToken }),
            })
            if (exchangeRes.status === 401) {
              core.setFailed('Prisma OIDC exchange denied (repo not connected in Console)')
              return
            }
            if (!exchangeRes.ok) {
              core.setFailed(`Prisma credential exchange responded ${exchangeRes.status}`)
              return
            }
            const { data } = await exchangeRes.json()
            core.setSecret(data.value)
            core.exportVariable('PRISMA_SERVICE_TOKEN', data.value)
            core.info(`OIDC exchange ok (workspace ${data.workspaceId})`)

      - name: Deploy to Prisma Compute
        run: |
          BRANCH="${GITHUB_REF_NAME}"
          CLI="bunx @prisma/cli@preview"
          set +e
          if [ "$BRANCH" = "main" ]; then
            OUT=$($CLI app deploy --framework nextjs --json 2>&1)
            STATUS=$?
          else
            OUT=$($CLI app deploy --framework nextjs --branch "$BRANCH" --json 2>&1)
            STATUS=$?
          fi
          set -e
          echo "$OUT"
          if [ "$STATUS" -eq 0 ]; then
            exit 0
          fi
          if echo "$OUT" | grep -q 'PROJECT_NOT_FOUND'; then
            echo "::warning::Prisma Compute project missing/inaccessible in this workspace; deploy skipped until Console project is fixed."
            exit 0
          fi
          exit "$STATUS"
