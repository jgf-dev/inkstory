name: Change Tracking Marker
on:
  release:
    types:
      - published
permissions:
  contents: read
jobs:
  newrelic:
    runs-on: ubuntu-latest
    name: New Relic
    steps:
      - name: Set Release Version from Tag
        run: echo "RELEASE_VERSION=${{ github.ref_name }}" >> $GITHUB_ENV
      - name: New Relic Application Deployment Marker
        uses: newrelic/deployment-marker-action@v2.6.2
        with:
          commandType: changeTrackingCreateEvent
          region: EU
          apiKey: ${{ secrets.NEW_RELIC_API_KEY }}
          entitySearch: id = 'ODU3NzkxNHxBUE18QVBQTElDQVRJT058MzYwMTExMjYy'
          category: Deployment
          type: BASIC
          version: ${{ env.RELEASE_VERSION }}
          user: ${{ github.actor }}
          description: inkstory app github
          shortDescription: inkstory-git
          commit: ${{ github.sha }}
          groupid: story-apps

