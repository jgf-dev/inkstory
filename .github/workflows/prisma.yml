name: Deploy
on:
  push:
    paths:
      - migrations/**
      - prisma/migrations/**
      - prisma/contract.prisma
    branches:
      - main

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - name: Use npm 12 (matches local tooling and lockfile)
        run: npm install -g npm@12.0.2 --ignore-scripts
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Emit Prisma contract
        run: ./node_modules/.bin/prisma contract emit
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
      - name: Apply all pending migrations to the database
        run: ./node_modules/.bin/prisma db migrate
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
