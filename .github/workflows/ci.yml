name: CI

on:
  push:
    branches: [main, feat/**]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - run: npm ci

      - run: npm run lint
      - run: npm run typecheck
      - run: npm run format:check
      - run: npm run build

      - name: Check Prisma schema is valid
        run: npx prisma validate
        env:
          # CI doesn't talk to a real DB; validate against a placeholder URL.
          DATABASE_URL: "postgresql://placeholder@localhost:5432/placeholder"
      - name: 'notify vercel'
        uses: 'vercel/repository-dispatch/actions/status@v1'
        with:
          name: 'Vercel - inkstory: lint'


