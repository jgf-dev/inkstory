name: CI

on:
  push:
    branches: [main, feat/**]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: oven-sh/setup-bun@4c1f1ad0c1c6b8cd5dc9b4da65fa6e6b1019fd5c # v1
        with:
          bun-version: latest

      # Skip lifecycle scripts during install; emit Prisma contract explicitly below.
      - run: bun install --ignore-scripts

      - name: Emit Prisma contract
        run: bunx prisma contract emit
        env:
          DATABASE_URL: "postgresql://placeholder@localhost:5432/placeholder"

      - run: bun run lint
      - run: bun run typecheck
      - run: bun run format:check
      - run: bun run build

      - name: "notify vercel"
        uses: vercel/repository-dispatch/actions/status@44f4d342ebc265c58167a2aa77d5a0d5a6eb20fd # actions/status/v1
        with:
          name: "Vercel - inkstory: lint"
