name: CI

on:
  push:
    branches: [main, feat/**]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # Node 24 matches repo runtime and other deployment workflows
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"

      - name: Use npm 12 (matches local tooling and lockfile)
        run: npm install -g npm@12.0.2 --ignore-scripts

      - name: Cache npm
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-

      # Skip lifecycle scripts during install; emit Prisma contract explicitly below.
      - run: npm ci --ignore-scripts

      - name: Emit Prisma contract
        run: ./node_modules/.bin/prisma contract emit
        env:
          DATABASE_URL: "postgresql://placeholder@localhost:5432/placeholder"

      # prisma contract emit writes single-quoted TS/JSON; vp fmt expects double quotes.
      - name: Format generated Prisma contract
        run: ./node_modules/.bin/vp fmt prisma/contract.d.ts prisma/contract.json

      - run: npm run lint
      - run: npm run typecheck
      - run: npm run format:check
      - run: npm run build

      - name: "notify vercel"
        uses: vercel/repository-dispatch/actions/status@44f4d342ebc265c58167a2aa77d5a0d5a6eb20fd # actions/status/v1
        with:
          name: "Vercel - inkstory: lint"