# Disposable Postgres for local Vitest runs. Matches the Sonar CI service in
# .github/workflows/sonarqube.yml (Postgres 17, db inkstory_test, postgres/postgres,
# published on localhost:5432).
#
# Default image is the same GHCR mirror CI uses. If a local `docker pull` of that
# tag fails (auth or rate limit), run:
#   INKSTORY_TEST_POSTGRES_IMAGE=postgres:17 bun run test:db
# Do not introduce mirror.gcr.io unless CI is changed to use it.
name: inkstory-test

services:
  postgres:
    image: ${INKSTORY_TEST_POSTGRES_IMAGE:-ghcr.io/jgf-dev/postgres:17}
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: inkstory_test
    ports:
      - "5432:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d inkstory_test"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s
